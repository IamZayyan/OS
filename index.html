<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web OS Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; }
        #desktop { width: 100%; height: calc(100% - 40px); background: linear-gradient(135deg, #1e1e2f, #0f0c1b); position: relative; padding: 20px; }
        .shortcut { width: 80px; text-align: center; color: white; cursor: pointer; }
        .shortcut .icon { font-size: 40px; }
        .window { position: absolute; width: 400px; height: 300px; background: #252538; border: 1px solid #444; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; z-index: 10; }
        .window-header { background: #1a1a26; padding: 10px; color: white; display: flex; justify-content: space-between; cursor: move; }
        .close-btn { background: #ff5f56; border: none; border-radius: 50%; width: 12px; height: 12px; cursor: pointer; }
        .window-content { flex: 1; background: white; }
        #taskbar { width: 100%; height: 40px; background: #111; display: flex; align-items: center; padding: 0 10px; color: white; position: fixed; bottom: 0; z-index: 100; }
    </style>
</head>
<body>
    <div id="desktop">
        <div class="shortcut" onclick="openLocalApp('Notepad')">
            <div class="icon">📝</div>
            <div class="label">Notepad</div>
        </div>
        <div id="window-container"></div>
    </div>
    <div id="taskbar">
        <button id="start-btn">🚀 Apps</button>
        <div id="active-apps"></div>
        <div id="clock">12:00 PM</div>
    </div>
    <script>
        function openLocalApp(title) {
            const container = document.getElementById('window-container');
            const win = document.createElement('div');
            win.className = 'window';
            win.style.left = '100px';
            win.style.top = '100px';
            win.innerHTML = `
                <div class="window-header"><span>${title}</span><button class="close-btn" onclick="this.closest('.window').remove()"></button></div>
                <div class="window-content" style="padding: 10px; height: 100%;"><textarea style="width: 100%; height: calc(100% - 20px); border: none; resize: none; outline: none; font-family: monospace;" placeholder="Type your text here..."></textarea></div>
            `;
            container.appendChild(win);
            makeDraggable(win);
        }
        function makeDraggable(el) {
            const header = el.querySelector('.window-header');
            let x = 0, y = 0, mouseX = 0, mouseY = 0;
            header.onmousedown = (e) => {
                e.preventDefault(); mouseX = e.clientX; mouseY = e.clientY;
                document.onmousemove = (e) => {
                    e.preventDefault(); x = mouseX - e.clientX; y = mouseY - e.clientY; mouseX = e.clientX; mouseY = e.clientY;
                    el.style.top = (el.offsetTop - y) + "px"; el.style.left = (el.offsetLeft - x) + "px";
                };
                document.onmouseup = () => { document.onmousemove = null; document.onmouseup = null; };
            };
        }
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
